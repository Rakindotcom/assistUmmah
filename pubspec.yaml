name: ummah_assist
description: A Flutter self-accountability app for Muslim daily tasks, prayers, growth, and contacts.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  characters: ^1.4.0
  intl: ^0.20.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^5.6.0
  url_launcher: ^6.3.3
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.3.4
  firebase_core: ^3.9.0
  firebase_crashlytics: ^4.3.10
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.1.1
  google_sign_in: ^6.2.2
  timezone: ^0.10.1
  adhan_dart: ^2.0.1
  geolocator: ^14.1.2
  shared_preferences: ^2.5.6
  sembast: ^3.9.0
  sembast_web: ^2.4.6+1
  path_provider: ^2.1.6
  crypto: ^3.0.8
  file_picker: ^13.3.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/app_icon.png
    - assets/legal/privacy.bn.json
    - assets/legal/account-data-paths.json
    - assets/fonts/AnekBangla-OFL.txt
    - assets/fonts/NotoNaskhArabic-OFL.txt
  fonts:
    - family: AnekBangla
      fonts:
        - asset: assets/fonts/AnekBangla.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
