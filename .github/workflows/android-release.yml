name: Android release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: python -m pip install Pillow
      - name: Provision private Android inputs
        env:
          FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_JSON_BASE64 }}
          ANDROID_UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        run: |
          umask 077
          test -n "$FIREBASE_ANDROID_JSON_BASE64"
          test -n "$ANDROID_UPLOAD_KEY_BASE64"
          test -n "$ANDROID_KEY_PROPERTIES_BASE64"
          printf '%s' "$FIREBASE_ANDROID_JSON_BASE64" | base64 --decode > android/app/google-services.json
          printf '%s' "$ANDROID_UPLOAD_KEY_BASE64" | base64 --decode > android/upload-keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES_BASE64" | base64 --decode > android/key.properties
      - name: Provision official bundletool
        run: |
          mkdir -p .local
          curl --fail --location --output .local/bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  .local/bundletool.jar' | sha256sum --check
      - run: tool/build_android_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-candidate
          path: |
            build/app/outputs/bundle/release/app-release.aab
            docs/release/bundle-verification.json
            docs/release/bundle-verification.manifest.xml
            build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - name: Remove private build inputs
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks android/app/google-services.json
